<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Valino's Tech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00ff88; /* Verde Neon igual à vitrine */
            --bg: #0d0d0d; 
            --card: #1a1a1a; /* Fundo do card escuro */
        }
        body { 
            font-family: 'Roboto', sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .login-container { 
            background: var(--card); 
            padding: 30px; 
            border-radius: 8px; 
            width: 350px; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1); 
            border: 1px solid #333;
        }
        .logo { 
            text-align: center; 
            font-weight: bold; 
            font-size: 24px; 
            color: var(--primary); 
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--primary); 
            padding-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        h1 { 
            font-size: 20px; 
            margin-bottom: 20px; 
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            text-align: center;
        }
        .input-box { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #aaa; }
        input[type="email"], input[type="password"], input[type="number"] { 
            width: 100%; 
            padding: 10px; 
            background-color: #262626;
            border: 1px solid #444; 
            border-radius: 4px; 
            box-sizing: border-box; 
            color: #fff;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }
        .pass-wrapper { position: relative; }
        .toggle-btn { position: absolute; right: 10px; top: 12px; cursor: pointer; color: #888; }
        .captcha-box { 
            background: #262626; 
            padding: 10px; 
            border-radius: 4px; 
            margin-bottom: 15px; 
            border: 1px solid #444; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }
        .captcha-text { font-weight: bold; font-size: 14px; color: var(--primary); }
        .captcha-input { width: 70px !important; padding: 5px !important; text-align: center; }
        .btn-entrar { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            color: #000;
            margin-top: 10px; 
            font-family: 'Orbitron', sans-serif;
            transition: background 0.2s;
        }
        .btn-entrar:hover { background: #00cc6e; }
        .divider { text-align: center; margin: 20px 0; border-bottom: 1px solid #333; line-height: 0.1em; }
        .divider span { background: var(--card); padding: 0 10px; color: #777; font-size: 12px; }
        .btn-cadastro { 
            width: 100%; 
            padding: 10px; 
            background: transparent; 
            border: 1px solid var(--primary); 
            border-radius: 4px; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            text-align: center; 
            color: var(--primary); 
            font-size: 13px; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        .btn-cadastro:hover { background: rgba(0, 255, 136, 0.1); }
        .error-msg { color: #ff4444; font-size: 12px; margin-top: -10px; margin-bottom: 10px; text-align: center; }
        .forgot-pass { display: block; text-align: right; font-size: 12px; color: #888; text-decoration: none; margin-top: 5px; }
        .forgot-pass:hover { text-decoration: underline; color: var(--primary); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">VALINO'S TECH @GAMES</div>
        <h1>FAZER LOGIN</h1>
        
        <form th:action="@{/login}" method="post" id="loginForm" onsubmit="return validarCaptcha(event)">
            
            <div th:if="${param.error}" class="error-msg">E-mail ou senha inválidos!</div>
            <div th:if="${param.logout}" class="error-msg" style="color: #00ff88;">Você saiu com sucesso!</div>

            <div class="input-box">
                <label>E-mail</label>
                <input type="email" name="username" required placeholder="seu@email.com">
            </div>
            <div class="input-box">
                <label>Senha</label>
                <div class="pass-wrapper">
                    <input type="password" id="pass" name="password" required>
                    <i class="fa-solid fa-eye toggle-btn" onclick="toggle('pass', this)"></i>
                </div>
                <a th:href="@{/esqueci-senha}" class="forgot-pass">Esqueceu a senha?</a>
            </div>

            <label>Verificação de Segurança</label>
            <div class="captcha-box">
                <span class="captcha-text" id="question"></span>
                <input type="number" id="captcha-ans" class="captcha-input" placeholder="?" required>
            </div>
            <div id="captcha-error" class="error-msg" style="display: none;">Resultado incorreto!</div>

            <div style="font-size: 13px; margin-bottom: 15px; color: #aaa;">
                <input type="checkbox" required> Não sou um robô 🤖
            </div>

            <button type="submit" class="btn-entrar">CONTINUAR</button>
        </form>

        <div class="divider"><span>Novo na Valino's Tech?</span></div>
        <a th:href="@{/cadastro}" class="btn-cadastro">CRIAR SUA CONTA</a>
    </div>

    <script>
        function toggle(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        let n1 = Math.floor(Math.random() * 10) + 1;
        let n2 = Math.floor(Math.random() * 10) + 1;
        let correctSum = n1 + n2;
        document.getElementById('question').innerText = `Quanto é ${n1} + ${n2}?`;

        function validarCaptcha(e) {
            const userAns = document.getElementById('captcha-ans').value;
            if (parseInt(userAns) !== correctSum) {
                e.preventDefault();
                document.getElementById('captcha-error').style.display = 'block';
                n1 = Math.floor(Math.random() * 10) + 1;
                n2 = Math.floor(Math.random() * 10) + 1;
                correctSum = n1 + n2;
                document.getElementById('question').innerText = `Quanto é ${n1} + ${n2}?`;
                document.getElementById('captcha-ans').value = '';
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
