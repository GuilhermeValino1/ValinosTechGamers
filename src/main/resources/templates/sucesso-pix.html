<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguardando Pix | Valino's Tech Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Roboto', sans-serif; text-align: center; }
        .navbar-brand, h2, .neon-text { font-family: 'Orbitron', sans-serif; color: #00ff88; }
        .sucesso-box { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; max-width: 600px; margin: 50px auto; padding: 40px; }
        .qrcode-box { background-color: #ffffff; padding: 15px; border-radius: 8px; display: inline-block; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .btn-game { background-color: #00ff88; color: #000; font-weight: bold; font-family: 'Orbitron', sans-serif; border: none; }
        .btn-game:hover { background-color: #00cc6e; color: #000; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
        .form-control { background-color: #262626; border: 1px solid #444; color: #fff; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sucesso-box shadow">
            <h2 class="mb-3">QUASE LÁ! PAGUE COM PIX</h2>
            <p class="text-secondary small">Abra o app do seu banco e escaneie o QR Code abaixo para liberar o envio do seu pedido imediatamente.</p>
            
            <div class="my-4">
                <div class="qrcode-box">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=ValinosTechGamesPixDinamicoOficialBancoDoBrasil" alt="QR Code Pix">
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-muted small">Código Copia e Cola Oficial</label>
                <div class="input-group">
                    <input type="text" class="form-control text-secondary" value="00020126360014BR.GOV.BCB.PIX0114valinostechpixdinamico2026" readonly id="pixFinalCode">
                    <button class="btn btn-outline-secondary text-white" type="button" onclick="navigator.clipboard.writeText(document.getElementById('pixFinalCode').value); alert('Código Copia e Cola copiado com sucesso!');">Copiar</button>
                </div>
            </div>

            <p class="small text-muted mb-4"><i class="fa-solid fa-spinner fa-spin text-success"></i> Detectando pagamento automaticamente em tempo real...</p>
            <a href="/" class="btn btn-game w-100 py-3">VOLTAR À VITRINE PRINCIPAL</a>
        </div>
    </div>
</body>
</html>
