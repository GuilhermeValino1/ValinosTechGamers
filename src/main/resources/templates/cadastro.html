<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta | Valino's Tech</title>
    <!-- Adicionando Font Awesome para o ícone do olhinho -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #39ff14; --bg: #0d0d0d; --card: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; background: var(--card); padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,255,0,0.1); }
        .section-title { font-size: 18px; border-bottom: 2px solid var(--primary); padding-bottom: 5px; margin: 20px 0 15px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Estilo para o Wrapper da Senha com Olhinho */
        .pass-wrapper { position: relative; }
        .toggle-btn { position: absolute; right: 10px; top: 38px; cursor: pointer; color: #666; }

        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        .btn-finalizar { flex: 2; padding: 15px; background: var(--primary); border: 1px solid #2dbd11; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-finalizar:hover { background: #32cd32; }
        
        .btn-voltar { 
            flex: 1; padding: 15px; background: #e7e9ec; border: 1px solid #adb1b8; 
            border-radius: 4px; text-decoration: none; color: black; 
            text-align: center; font-weight: bold; font-size: 14px; 
            display: flex; align-items: center; justify-content: center; 
        }
        .btn-voltar:hover { background: #d8dade; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top:0;">Criar conta</h2>
        <!-- CORRIGIDO AQUI: de /cadastrar para /cadastro -->
        <form th:action="@{/cadastro}" method="post">
            <div class="section-title">Dados Pessoais</div>
            <div class="grid">
                <div class="full">
                    <label>Nome completo</label>
                    <input type="text" name="nome" placeholder="Como no seu documento" required>
                </div>
                <div>
                    <label>CPF</label>
                    <input type="text" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div>
                    <label>E-mail</label>
                    <input type="email" name="email" required>
                </div>
                
                <!-- Campo Senha com Olhinho -->
                <div class="pass-wrapper">
                    <label>Senha</label>
                    <input type="password" id="senha" name="senha" required>
                    <i class="fa-solid fa-eye toggle-btn" onclick="toggle('senha', this)"></i>
                </div>
                
                <!-- Campo Repetir Senha com Olhinho -->
                <div class="pass-wrapper">
                    <label>Repetir Senha</label>
                    <input type="password" id="repetir" name="repetirSenha" required>
                    <i class="fa-solid fa-eye toggle-btn" onclick="toggle('repetir', this)"></i>
                </div>
            </div>

            <div class="section-title">Dados de Entrega</div>
            <div class="grid">
                <div>
                    <label>CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                </div>
                <div class="full">
                    <label>Rua/Avenida</label>
                    <input type="text" id="rua" name="rua" required>
                </div>
                <div>
                    <label>Número</label>
                    <input type="text" name="numero" required>
                </div>
                <div>
                    <label>Complemento</label>
                    <input type="text" name="complemento">
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="btn-group">
                <button type="submit" class="btn-finalizar">Finalizar Cadastro</button>
                <a th:href="@{/login}" class="btn-voltar">Voltar</a>
            </div>
        </form>
    </div>

    <script>
        function toggle(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const cepInput = document.getElementById('cep');
        const ruaInput = document.getElementById('rua');

        cepInput.addEventListener('blur', () => {
            let cep = cepInput.value.replace(/\D/g, '');
            if (cep.length === 8) {
                ruaInput.value = "Buscando...";
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(dados => {
                        if (!dados.erro) {
                            ruaInput.value = dados.logradouro;
                        } else {
                            alert("CEP não encontrado!");
                            ruaInput.value = "";
                        }
                    })
                    .catch(error => {
                        console.error('Erro na busca:', error);
                        ruaInput.value = "";
                    });
            }
        });
    </script>
</body>
</html>
