<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine - Valino's Tech Games</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Roboto', sans-serif; }
        .navbar-brand, h2 { font-family: 'Orbitron', sans-serif; color: #00ff88; }
        .card { background-color: #1a1a1a; border: 1px solid #333; transition: transform 0.3s, box-shadow 0.3s; height: 100%; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); border-color: #00ff88; }
        .price-tag { color: #00ff88; font-size: 1.5rem; font-weight: bold; }
        .btn-gamer { background-color: #00ff88; color: #000; font-weight: bold; border: none; text-decoration: none; display: block; text-align: center; }
        .btn-gamer:hover { background-color: #00cc6e; color: #000; }
        .btn-login-auth { background-color: #333; color: #888; font-weight: bold; border: 1px solid #444; text-decoration: none; display: block; text-align: center; transition: all 0.2s; }
        .btn-login-auth:hover { background-color: #444; color: #00ff88; border-color: #00ff88; }
        .badge-stock { background-color: #333; color: #00ff88; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">VALINO'S TECH @GAMES</a>
            
            <form class="d-flex mx-auto" action="/" method="get">
                <input class="form-control me-2 bg-dark text-white border-secondary" type="search" name="nome" placeholder="Buscar produto..." aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>

            <div class="d-flex align-items-center border-start ps-3">
                <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                    <i class="fa-solid fa-user-circle me-1" style="color: #00ff88;"></i>
                    Olá, <span th:text="${usuarioLogado != null ? usuarioLogado.nome : 'Gamer'}">Gamer</span>!
                </span>
                <a href="/admin/dashboard" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-success btn-sm me-3">Painel Admin</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Sair</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>EQUIPAMENTOS DISPONÍVEIS</h2>
            <span class="badge badge-stock p-2" th:text="${produtos != null ? produtos.size() : 0} + ' itens disponíveis'"></span>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4" th:each="p : ${produtos}">
                <div class="card p-2">
                    <div style="width: 100%; height: 200px; background-color: #111; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                        <img th:src="${p.imagemUrl}" alt="Imagem do Produto" class="w-100 h-100" style="object-fit: cover;" onerror="this.src='https://via.placeholder.com/300x200?text=Sem+Imagem'" />
                    </div>

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-uppercase">
                            <a th:href="@{/produto/{id}(id=${p.id})}" class="text-white text-decoration-none" th:text="${p.nome}">Nome</a>
                        </h5>
                        <p class="card-text text-secondary flex-grow-1" th:text="${p.descricao}">Descrição</p>
                        <hr class="border-secondary">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="price-tag" th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                        </div>
                        <p class="small text-muted mt-2">Estoque: <span th:text="${p.quantidade}">0</span></p>
                        <div sec:authorize="!isAuthenticated()">
                            <a href="/login" class="btn btn-login-auth w-100 mt-3 py-2">FAÇA LOGIN PARA COMPRAR</a>
                        </div>
                        <div sec:authorize="isAuthenticated()">
                            <a th:href="@{/carrinho/adicionar/{id}(id=${p.id})}" class="btn btn-gamer w-100 mt-3 py-2">ADICIONAR AO SETUP</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${produtos == null or #lists.isEmpty(produtos)}" class="text-center py-5">
            <h4 class="text-secondary">Nenhum equipamento encontrado.</h4>
        </div>
    </div>

    <footer class="text-center mt-5 py-4 border-top border-secondary text-secondary">
        <p>&copy; 2026 Valino's Tech Games</p>
    </footer>

    <a href="https://wa.me/5511999999999" target="_blank" 
       style="position:fixed; bottom:20px; right:20px; background-color:#25d366; color:white; border-radius:50px; padding:15px 20px; font-size:24px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); z-index:1000;">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
</body>
</html>
