<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${produto.nome} + ' | Valino\'s Tech'">Detalhes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: white; font-family: 'Roboto', sans-serif; }
        .price-tag { color: #00ff88; font-size: 2.5rem; font-weight: bold; }
        .img-detalhe { width: 100%; border-radius: 10px; border: 2px solid #00ff88; }
    </style>
</head>
<body class="container py-5">
    <div class="row">
        <div class="col-md-6">
            <img th:src="${produto.imagemUrl}" class="img-detalhe" alt="Produto">
        </div>
        <div class="col-md-6">
            <h1 th:text="${produto.nome}">Nome do Produto</h1>
            <p class="text-secondary mt-4" th:text="${produto.descricao}">Descrição completa aqui...</p>
            <div class="price-tag my-4" th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
            
            <a th:href="@{/carrinho/adicionar/{id}(id=${produto.id})}" class="btn btn-success btn-lg w-100 fw-bold">ADICIONAR AO SETUP</a>
            <a href="/" class="btn btn-outline-secondary mt-3 w-100">VOLTAR PARA VITRINE</a>
        </div>
    </div>
</body>
</html>
