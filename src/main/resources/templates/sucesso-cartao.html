<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Aprovada | Valino's Tech Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Roboto', sans-serif; text-align: center; }
        .navbar-brand, h2, .neon-text { font-family: 'Orbitron', sans-serif; color: #00ff88; }
        .sucesso-box { background-color: #1a1a1a; border: 1px solid #00ff88; border-radius: 8px; max-width: 600px; margin: 80px auto; padding: 40px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        .success-icon { font-size: 70px; color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.5); animation: pulse 2s infinite; }
        .btn-game { background-color: #00ff88; color: #000; font-weight: bold; font-family: 'Orbitron', sans-serif; border: none; }
        .btn-game:hover { background-color: #00cc6e; color: #000; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="sucesso-box shadow">
            <div class="mb-4">
                <i class="fa-solid fa-circle-check success-icon"></i>
            </div>
            <h2 class="mb-3">SETUP GARANTIDO!</h2>
            <p class="text-secondary">Sua compra com <strong>Cartão de Crédito</strong> foi processada e aprovada com sucesso em nosso gateway seguro.</p>
            <hr class="border-secondary my-4">
            <p class="small text-muted"><i class="fa-solid fa-envelope"></i> Enviamos os detalhes do pedido e o código de rastreio para o seu e-mail cadastrado.</p>
            <a href="/" class="btn btn-game w-100 py-3 mt-3">VOLTAR À VITRINE PRINCIPAL</a>
        </div>
    </div>
</body>
</html>
