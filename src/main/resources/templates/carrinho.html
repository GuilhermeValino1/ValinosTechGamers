<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Seu Setup - Valino's Tech Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: #fff; }
        .table-gamer { background-color: #1a1a1a; color: #fff; }
        .btn-qty { color: #00ff88; border: 1px solid #333; padding: 5px 10px; text-decoration: none; }
        .price-neon { color: #00ff88; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>SEU SETUP</h2>
        <table class="table table-gamer">
            <thead>
                <tr><th>Equipamento</th><th>Preço</th><th>Quantidade</th><th>Subtotal</th><th>Ação</th></tr>
            </thead>
            <tbody>
                <tr th:each="item, iterStat : ${itens}">
                    <td th:text="${item.produto.nome}"></td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(item.produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <a th:href="@{/carrinho/diminuir/{index}(index=${iterStat.index})}" class="btn-qty">-</a>
                        <span th:text="${item.quantidade}" class="mx-3"></span>
                        <a th:href="@{/carrinho/aumentar/{index}(index=${iterStat.index})}" class="btn-qty">+</a>
                    </td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <a th:href="@{/carrinho/remover/{index}(index=${iterStat.index})}" class="btn btn-danger btn-sm">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="text-end">
            <h3>Total: R$ <span th:text="${#numbers.formatDecimal(totalGeral, 1, 'POINT', 2, 'COMMA')}"></span></h3>
            <a href="/carrinho/checkout" class="btn btn-success">AVANÇAR PARA PAGAMENTO</a>
        </div>
    </div>
</body>
</html>
