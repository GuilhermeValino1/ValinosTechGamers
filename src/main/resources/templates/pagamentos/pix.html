<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finalize seu Pagamento - PIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pix-code-box { background-color: #f8f9fa; border: 1px dashed #007bff; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Pagamento via PIX</h4>
                </div>
                <div class="card-body text-center">
                    <p class="lead">Pedido: <strong>#<span th:text="${pedido.id}"></span></strong></p>
                    <p>Valor total: <strong>R$ <span th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 'COMMA', 2, 'POINT')}"></span></strong></p>
                    
                    <hr>
                    
                    <p>Copie o código abaixo e cole no seu aplicativo bancário na opção <strong>Pix Copia e Cola</strong>:</p>
                    
                    <div class="pix-code-box p-3 mb-3 rounded">
                        <code id="pixCode" style="word-break: break-all;" th:text="${copiaECola}"></code>
                    </div>
                    
                    <button class="btn btn-success btn-lg w-100" onclick="copiarPix()">
                        Copiar Código Pix
                    </button>
                    
                    <div class="mt-3">
                        <a href="/" class="text-secondary">Voltar para a loja</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function copiarPix() {
        const codigo = document.getElementById("pixCode").innerText;
        navigator.clipboard.writeText(codigo).then(() => {
            alert("Código copiado! Agora basta abrir seu banco e colar.");
        }).catch(err => {
            console.error('Erro ao copiar: ', err);
        });
    }
</script>

</body>
</html>
