<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Usuários | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: #fff; }
        h2 { font-family: 'Orbitron', sans-serif; color: #00ff88; }
        .table-custom { background-color: #1a1a1a; border: 1px solid #333; }
    </style>
</head>
<body class="p-5">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>GERENCIAMENTO DE USUÁRIOS</h2>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm">Voltar ao Dashboard</a>
        </div>

        <div th:if="${param.sucesso}" class="alert alert-success bg-dark text-success border-success">
            Nível de acesso atualizado com sucesso!
        </div>

        <div class="card table-custom p-4 shadow">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr class="text-secondary border-bottom border-secondary">
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Cargo Atual</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}" style="border-bottom: 1px solid #262626;">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.nome}" class="text-white fw-bold">Nome</td>
                        <td th:text="${u.email}">email@teste.com</td>
                        <td>
                            <span th:class="${u.tipo == 'ROLE_ADMIN' || u.tipo == 'ADMIN'} ? 'badge bg-success text-black fw-bold' : 'badge bg-secondary'"
                                  th:text="${u.tipo}">ROLE_USER</span>
                        </td>
                        <td class="text-center">
                            <form th:if="${u.tipo != 'ROLE_ADMIN' && u.tipo != 'ADMIN'}" 
                                  th:action="@{/admin/usuarios/promover/{id}(id=${u.id})}" method="post">
                                <button type="submit" class="btn btn-outline-success btn-sm fw-bold">
                                    ⚙️ TORNAR ADMIN
                                </button>
                            </form>
                            <span th:if="${u.tipo == 'ROLE_ADMIN' || u.tipo == 'ADMIN'}" class="text-muted small">Já possui acesso total</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
