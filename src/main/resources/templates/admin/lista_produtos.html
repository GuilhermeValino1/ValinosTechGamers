<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estoque - Valino's Tech</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Gerenciamento de Estoque - Valino's Tech Games</h2>
    
    <table class="table table-striped table-hover border">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                <td th:text="${p.quantidade}"></td>
                <td>
                    <a th:href="@{/admin/produtos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/admin/produtos/deletar/{id}(id=${p.id})}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Deseja excluir este item do estoque?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div class="mt-3">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Voltar ao Painel</a>
        <a th:href="@{/admin/produtos/novo}" class="btn btn-primary">Adicionar Novo Produto</a>
    </div>
</body>
</html>
