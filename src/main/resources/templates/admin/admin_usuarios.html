<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Usuários - Valino's Tech Games</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
        }
        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00ff88; /* Verde Neon */
        }
        .table-custom {
            background-color: #1a1a1a;
            border: 1px solid #333;
        }
        .btn-neon-success {
            background-color: transparent;
            color: #00ff88;
            border: 1px solid #00ff88;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
        }
        .btn-neon-success:hover {
            background-color: #00ff88;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        .badge-admin {
            background-color: #00ff88;
            color: #000;
            font-weight: bold;
        }
        .badge-user {
            background-color: #333;
            color: #888;
            border: 1px solid #444;
        }
    </style>
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>GERENCIAMENTO DE USUÁRIOS</h2>
        <a href="/admin/dashboard" class="btn btn-outline-secondary">Voltar ao Painel Admin</a>
    </div>

    <div th:if="${param.sucesso}" class="alert alert-success bg-dark text-success border-success mb-4">
        Nível de acesso do usuário atualizado com sucesso! 🛡️
    </div>
    
    <div class="card table-custom p-4 shadow">
        <table class="table table-dark table-hover align-middle mb-0">
            <thead>
                <tr class="text-secondary border-bottom border-secondary">
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Tipo</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}" style="border-bottom: 1px solid #262626;">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.nome}" class="text-white fw-bold"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span th:class="${u.tipo == 'ADMIN'} ? 'badge badge-admin' : 'badge badge-user'"
                              th:text="${u.tipo != null ? u.tipo : 'USER'}">USER</span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            
                            <form th:if="${u.tipo != 'ADMIN'}" th:action="@{/admin/usuarios/promover/{id}(id=${u.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-neon-success btn-sm">
                                    ⚙️ TORNAR ADMIN
                                </button>
                            </form>
                            
                            <span th:if="${u.tipo == 'ADMIN'}" class="text-muted small align-self-center">Acesso Total</span>

                            <a th:href="@{/admin/usuarios/deletar/{id}(id=${u.id})}" 
                               class="btn btn-outline-danger btn-sm ms-2" 
                               onclick="return confirm('Tem certeza que deseja excluir este usuário do sistema?')">Excluir</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
