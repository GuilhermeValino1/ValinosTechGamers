<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Valino's Tech Games</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .dashboard-cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #39ff14; /* Mudei para o verde neon da sua marca */
            flex: 1;
            text-align: center;
        }
        .card h3 { margin: 0; color: #333; }
        .card p { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .nav-admin { 
            margin-bottom: 30px; 
            display: flex; 
            align-items: center; 
            background: #222; 
            padding: 10px; 
            border-radius: 5px;
        }
        .nav-admin a { 
            margin-right: 15px; 
            text-decoration: none; 
            color: white; 
            background: #333; 
            padding: 10px 15px; 
            border-radius: 5px;
            font-size: 14px;
        }
        .nav-admin a:hover { background: #444; }
        
        /* Estilo para o botão de Sair */
        .logout-form { margin-left: auto; }
        .btn-logout {
            background: #ce1212;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover { background: #ff0000; }
        
        .user-info { color: #39ff14; margin-right: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <h1>Valino's Tech Games - Administração</h1>
    </header>

    <nav class="nav-admin">
        <a th:href="@{/admin/usuarios}">Gerenciar Usuários</a>
        <a th:href="@{/admin/produtos/novo}">Cadastrar Produto</a>
        <a th:href="@{/}">Ver Loja</a>

        <span class="user-info" sec:authorize="isAuthenticated()">
            Olá, <span sec:authentication="name">Usuário</span>!
        </span>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn-logout">Sair</button>
        </form>
    </nav>

    <main>
        <h2>Resumo do Sistema</h2>
        <div class="dashboard-cards">
            <div class="card">
                <h3>Clientes</h3>
                <p th:text="${totalUsuarios}">0</p>
            </div>
            <div class="card">
                <h3>Produtos no Estoque</h3>
                <p th:text="${totalProdutos}">0</p>
            </div>
         <div class="card">
    <h3>Faturamento</h3>
    <p th:text="'R$ ' + ${#numbers.formatDecimal(faturamentoTotal, 1, 'COMMA', 2, 'POINT')}">R$ 0,00</p>
</div>
        </div>
    </main>
</body>
</html>
