<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Meus Pedidos - Valino's Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0d0d; color: #fff; }
        .card { background-color: #1a1a1a; border: 1px solid #333; }
        .text-green { color: #00ff88; }
    </style>
</head>
<body class="container py-5">
    <h2 class="text-green mb-4">Meus Pedidos</h2>
    
    <div class="card p-4" th:each="p : ${pedidos}">
        <div class="d-flex justify-content-between">
            <div>
                <p><strong>Pedido #[[${p.id}]]</strong></p>
                <p>Data: [[${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}]]</p>
                <p>Status: <span class="badge bg-secondary">[[${p.status}]]</span></p>
            </div>
            <div class="text-end">
                <h4 class="text-green">R$ [[${#numbers.formatDecimal(p.valorTotal, 1, 'POINT', 2, 'COMMA')}]]</h4>
                <a th:href="@{/carrinho/repetir/{id}(id=${p.id})}" class="btn btn-outline-success">Repetir Pedido</a>
            </div>
        </div>
    </div>
</body>
</html>
